<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>McMaster AIAA | Events</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
    <link rel="shortcut icon" href="favicon/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png" />
    <link rel="manifest" href="favicon/site.webmanifest" />
</head>

<body>

<div id="container">

    <!-- ===== HEADER ===== -->

    <div id="header">
        <div class="header-inner">

            <a href="index.html" id="homelink">

                <div id="headerlogo">
                    <img src="images/wingslogo_whitebg.png"
                         id="logo"
                         alt="McMaster AIAA logo">
                </div>

                <div id="headertext">
                    <h1>McMaster AIAA</h1>
                    <p>
                        The American Institute of Aeronautics and Astronautics at McMaster
                    </p>
                </div>

            </a>

            <div id="navbar">

                <a href="index.html" class="link">Home</a>

                <a href="about.html" class="link">About</a>

                <a href="projects.html" class="link">Initiatives</a>

                <a href="events.html" class="link active">Events</a>

                <a href="join.html" class="link">Join</a>

            </div>

        </div>
    </div>


    <!-- ===== PAGE CONTENT ===== -->

    <div class="page-content">

        <div class="container">

            <!-- Calendar Header -->

            <div class="calendar-header">

                <button id="prev-month"
                        class="calendar-nav"
                        aria-label="Previous month">
                    &larr;
                </button>

                <h1 id="calendar-month">
                    September 2026
                </h1>

                <button id="next-month"
                        class="calendar-nav"
                        aria-label="Next month">
                    &rarr;
                </button>

            </div>


            <!-- Today Button -->

            <div class="calendar-actions">

                <button id="today-button"
                        class="today-button">
                    Today
                </button>

            </div>


            <!-- Calendar -->

            <div class="calendar">

                <!-- Weekday Headers -->

                <div class="calendar-weekdays">

                    <div>Sun</div>
                    <div>Mon</div>
                    <div>Tue</div>
                    <div>Wed</div>
                    <div>Thu</div>
                    <div>Fri</div>
                    <div>Sat</div>

                </div>


                <!-- Calendar Days -->

                <div id="calendar-days"
                     class="calendar-days">

                    <!-- Calendar days generated by events.js -->

                </div>

            </div>

        </div>

    </div>


    <!-- ===== EVENT MODAL ===== -->

    <div id="event-modal"
         class="event-modal">

        <div class="event-modal-content">

            <!-- Close Button -->

            <button id="close-modal"
                    class="close-modal"
                    aria-label="Close event details">
                &times;
            </button>


            <!-- Event Name -->

            <h2 id="modal-event-name">
                Event Name
            </h2>


            <!-- Event Details -->

            <div class="event-details">

                <p>
                    <span class="event-icon">📅</span>

                    <span id="modal-event-date">
                        Event date
                    </span>
                </p>


                <p>
                    <span class="event-icon">🕐</span>

                    <span id="modal-event-time">
                        Event time
                    </span>
                </p>


                <p>
                    <span class="event-icon">📍</span>

                    <span id="modal-event-location">
                        Event location
                    </span>
                </p>

            </div>


            <!-- Event Description -->

            <p id="modal-event-description"
               class="modal-description">
                Event description
            </p>

        </div>

    </div>


    <!-- ===== FOOTER ===== -->

    <div id="footer">

        <div class="container footer-inner">

            <div class="footer-col">

                <p>
                    McMaster AIAA
                </p>

                <div class="social-links">

                    <a href="https://www.instagram.com/mcmasteraiaa/"
                       target="_blank">

                        <img class="footer-logo"
                             src="images/instagramLogo.png"
                             alt="Instagram">

                    </a>


                    <a href="https://www.linkedin.com/company/mcmasteraiaa/"
                       target="_blank">

                        <img class="footer-logo"
                             src="images/Icon-Linkedin.png"
                             alt="LinkedIn">

                    </a>

                </div>

            </div>


            <div class="footer-col">

                <p>
                    Email:
                    <a target="_blank"
                       href="mailto:mac_aiaa@mcmaster.ca">
                        mac_aiaa@mcmaster.ca
                    </a>
                </p>

                <p>
                    <a href="join.html">
                        Join us
                    </a>
                </p>

            </div>

        </div>

    </div>

</div>


<!-- ===== JAVASCRIPT ===== -->

<script src="js/script.js" defer></script>
<script src="js/events.js" defer></script>

</body>
</html>
